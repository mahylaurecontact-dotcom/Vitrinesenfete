<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vitrines en fête – Carte des commerces participants</title>
<style>
.vef{--c:#006265;--c-dark:#004648;--gold:#f4b400;--red:#b4233c;--ink:#1d2b2b;--line:#d5dede;--bg:#f4f8f8;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);max-width:1200px;margin:0 auto;box-sizing:border-box}
.vef *{box-sizing:border-box}
.vef header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:.5rem 1rem;margin-bottom:.75rem}
.vef h2{margin:0;font-size:1.6rem;line-height:1.2;color:var(--c)}
.vef .sub{margin:.2rem 0 0;font-size:1rem}
.vef .lang{display:flex;gap:.25rem}
.vef .lang button{border:1px solid var(--c);background:#fff;color:var(--c);padding:.3rem .7rem;border-radius:999px;font:inherit;font-size:.85rem;cursor:pointer}
.vef .lang button[aria-pressed="true"]{background:var(--c);color:#fff}
.vef .layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:1rem;align-items:start}
.vef .mapwrap{position:relative;height:min(72vh,680px);min-height:380px;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.vef .mapwrap.drag{cursor:grabbing}
.vef .mapwrap:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.vef .stage{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.vef .stage img{display:block;max-width:none;pointer-events:none;-webkit-user-drag:none}
.vef .pins{position:absolute;inset:0;pointer-events:none}
.vef .pin{position:absolute;pointer-events:auto;transform:translate(-50%,-50%);width:24px;height:24px;border-radius:50%;border:2px solid #fff;background:var(--c);color:#fff;font:700 11px/1 system-ui,sans-serif;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.45);cursor:pointer;padding:0}
.vef .pin:hover,.vef .pin:focus-visible{background:var(--c-dark);outline:3px solid var(--gold);z-index:5}
.vef .pin.sel{background:var(--red);width:30px;height:30px;z-index:6;font-size:13px}
.vef .pin.cluster{width:38px;height:38px;background:var(--gold);color:#1d1d1d;font-size:15px;border-color:#fff}
.vef .pin.cluster:hover{background:#ffc928}
.vef .popup{position:absolute;z-index:8;width:240px;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.25);padding:.6rem .7rem;font-size:.9rem;transform:translate(-50%,calc(-100% - 26px))}
.vef .popup::after{content:"";position:absolute;left:calc(50% + var(--arrow,0px));bottom:-7px;width:12px;height:12px;background:#fff;border-right:1px solid var(--line);border-bottom:1px solid var(--line);transform:translateX(-50%) rotate(45deg)}
.vef .popup strong{display:block;color:var(--c);padding-right:1.2rem}
.vef .popup .x{position:absolute;top:2px;right:4px;border:0;background:none;font-size:1.2rem;line-height:1;cursor:pointer;color:#555}
.vef .popup ul{list-style:none;margin:.3rem 0 0;padding:0}
.vef .popup li button{display:block;width:100%;text-align:left;border:0;background:none;padding:.25rem 0;font:inherit;cursor:pointer;color:var(--c)}
.vef .popup li button:hover{text-decoration:underline}
.vef .ctrl{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:4px;z-index:9}
.vef .ctrl button{width:36px;height:36px;border:1px solid var(--line);background:#fff;border-radius:6px;font-size:1.2rem;line-height:1;cursor:pointer;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.vef .ctrl button:hover{background:var(--bg)}
.vef .hint{position:absolute;left:8px;bottom:8px;z-index:9;background:rgba(255,255,255,.92);border-radius:6px;padding:.2rem .5rem;font-size:.75rem;color:#444;max-width:70%}
.vef aside{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--bg);max-height:min(72vh,680px);min-height:380px}
.vef .search{padding:.6rem;border-bottom:1px solid var(--line)}
.vef .search input{width:100%;padding:.5rem .6rem;border:1px solid var(--line);border-radius:6px;font:inherit;font-size:.95rem}
.vef .count{margin:.4rem 0 0;font-size:.8rem;color:#445}
.vef ol{list-style:none;margin:0;padding:0;overflow:auto;flex:1}
.vef ol li{border-bottom:1px solid var(--line)}
.vef ol li:last-child{border-bottom:0}
.vef ol button{display:flex;gap:.6rem;align-items:center;width:100%;text-align:left;border:0;background:none;padding:.5rem .7rem;font:inherit;cursor:pointer}
.vef ol button:hover,.vef ol button.sel{background:#e3f0f0}
.vef ol .num{flex:0 0 26px;height:26px;border-radius:50%;background:var(--c);color:#fff;font:700 12px/26px system-ui,sans-serif;text-align:center}
.vef ol button.sel .num{background:var(--red)}
.vef ol .t{display:block;font-weight:600;font-size:.92rem}
.vef ol .a{display:block;font-size:.8rem;color:#445}
.vef .none{padding:1rem;font-size:.9rem;color:#445}
.vef .note{margin:.6rem 0 0;font-size:.8rem;color:#445}
@media (max-width:820px){
 .vef .layout{grid-template-columns:1fr}
 .vef .mapwrap{height:62vh;min-height:340px}
 .vef aside{max-height:none;min-height:0}
 .vef ol{max-height:420px}
 .vef h2{font-size:1.35rem}
}
@media (prefers-reduced-motion:reduce){.vef .stage{transition:none}}
</style>
</head>

/* Calage de la carte (coordonnées GPS -> pixels de l’image 4152 x 2934) */
var IW = 4152, IH = 2934;
var CAL = { lat0: 50.866972, lon0: 4.281794, x0: 740, y0: 1205, kx: 1.329686, ky: 1.340331, m: 111320, cos: 0.63076 };
function toPx(lat, lon){
  return { x: CAL.x0 + (lon - CAL.lon0) * CAL.m * CAL.cos * CAL.kx,
           y: CAL.y0 + (CAL.lat0 - lat) * CAL.m * CAL.ky };
}

var T = {
  fr: {
    title: "Vitrines en fête",
    sub: "Carte des commerces participants – du 7 décembre 2026 au 3 janvier 2027",
    search: "Rechercher un commerce ou une rue",
    count: function(n,t){ return n === t ? t + " commerces participants" : n + " résultat(s) sur " + t + " commerces"; },
    none: "Aucun commerce ne correspond à votre recherche.",
    hint: "Glissez pour déplacer · Ctrl + molette ou boutons +/− pour zoomer",
    hintTouch: "Glissez pour déplacer · pincez ou boutons +/− pour zoomer",
    note: "Commune de Berchem-Sainte-Agathe. Les positions sont indicatives ; la liste peut encore évoluer.",
    cluster: function(n){ return n + " commerces – cliquer pour zoomer"; },
    close: "Fermer",
    map: "Carte interactive des commerces participants"
  },
  nl: {
    title: "Vitrines en fête",
    sub: "Kaart van de deelnemende handelszaken – van 7 december 2026 tot en met 3 januari 2027",
    search: "Zoek een handelszaak of straat",
    count: function(n,t){ return n === t ? t + " deelnemende handelszaken" : n + " resultaat/resultaten van " + t + " handelszaken"; },
    none: "Geen enkele handelszaak komt overeen met uw zoekopdracht.",
    hint: "Sleep om te verplaatsen · Ctrl + scrollwiel of knoppen +/− om te zoomen",
    hintTouch: "Sleep om te verplaatsen · knijp of knoppen +/− om te zoomen",
    note: "Gemeente Sint-Agatha-Berchem. De posities zijn bij benadering; de lijst kan nog wijzigen.",
    cluster: function(n){ return n + " handelszaken – klik om in te zoomen"; },
    close: "Sluiten",
    map: "Interactieve kaart van de deelnemende handelszaken"
  }
};
var lang = (function(){
  var l = (document.documentElement.lang || navigator.language || "fr").toLowerCase();
  return l.indexOf("nl") === 0 ? "nl" : "fr";
})();

function norm(s){ return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[’']/g,"'"); }

/* tri alphabétique + numérotation + positions (écarts si coordonnées quasi identiques) */
SHOPS.sort(function(a,b){ return norm(a.name).localeCompare(norm(b.name), "fr"); });
SHOPS.forEach(function(s,i){ s.n = i + 1; var p = toPx(s.lat, s.lon); s.x = p.x; s.y = p.y; s.key = norm(s.name + " " + s.addr); });
(function spread(){
  var groups = [];
  SHOPS.forEach(function(s){
    var g = groups.filter(function(g){ return Math.hypot(g.x - s.x, g.y - s.y) < 18; })[0];
    if(g){ g.items.push(s); } else { groups.push({ x: s.x, y: s.y, items: [s] }); }
  });
  groups.forEach(function(g){
    var n = g.items.length; if(n < 2) return;
    g.items.forEach(function(s,i){
      var a = (2 * Math.PI * i / n) - Math.PI / 2;
      s.x = g.x + Math.cos(a) * 24; s.y = g.y + Math.sin(a) * 24;
    });
  });
})();

var $ = function(id){ return document.getElementById(id); };
var wrap = $("vef-map"), stage = $("vef-stage"), pinsEl = $("vef-pins"), popup = $("vef-popup"),
    listEl = $("vef-list"), qEl = $("vef-q");
var W = 0, H = 0, fit = 0.2, MAX = 3.5, s = 0.2, tx = 0, ty = 0, inited = false;
var selected = null, visible = SHOPS.slice(), anim = null;

function clamp(){
  var iw = IW * s, ih = IH * s;
  tx = iw <= W ? (W - iw) / 2 : Math.min(0, Math.max(W - iw, tx));
  ty = ih <= H ? (H - ih) / 2 : Math.min(0, Math.max(H - ih, ty));
}
function setView(ns, ntx, nty){ s = ns; tx = ntx; ty = nty; clamp(); render(); }
function zoomAt(px, py, ns){
  ns = Math.min(MAX, Math.max(fit, ns));
  var ix = (px - tx) / s, iy = (py - ty) / s;
  setView(ns, px - ix * ns, py - iy * ns);
}
function flyTo(cx, cy, ns, cb){
  ns = Math.min(MAX, Math.max(fit, ns));
  var ttx = W / 2 - cx * ns, tty = H / 2 - cy * ns + (selected ? 40 : 0);
  var s0 = s, x0 = tx, y0 = ty, t0 = null, dur = 350;
  if(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches){ setView(ns, ttx, tty); if(cb) cb(); return; }
  if(anim) cancelAnimationFrame(anim);
  (function step(t){
    if(t0 === null) t0 = t;
    var k = Math.min(1, (t - t0) / dur), e = k < .5 ? 2*k*k : 1 - Math.pow(-2*k + 2, 2) / 2;
    s = s0 + (ns - s0) * e; tx = x0 + (ttx - x0) * e; ty = y0 + (tty - y0) * e; clamp(); render();
    if(k < 1) anim = requestAnimationFrame(step); else { anim = null; if(cb) cb(); }
  })(performance.now());
}

/* --- rendu : un point par commerce, jamais regroupé --- */
var lastPos = {};
var SVGNS = "http://www.w3.org/2000/svg";
function render(){
  stage.style.transform = "translate(" + tx + "px," + ty + "px) scale(" + s + ")";
  pinsEl.textContent = "";
  var D = 25, pts = visible.map(function(sh){ return { sh: sh, ox: sh.x * s + tx, oy: sh.y * s + ty }; })
    .filter(function(p){ return p.ox > -40 && p.ox < W + 40 && p.oy > -40 && p.oy < H + 40; });
  pts.forEach(function(p){ p.px = p.ox; p.py = p.oy; });
  /* écarte les pastilles qui se chevauchent (le vrai emplacement reste relié par un trait) */
  for(var it = 0; it < 120; it++){
    var moved = false;
    for(var i = 0; i < pts.length; i++){
      for(var j = i + 1; j < pts.length; j++){
        var dx = pts[j].px - pts[i].px, dy = pts[j].py - pts[i].py, d = Math.hypot(dx, dy);
        if(d < D){
          if(d < 0.01){ dx = Math.cos(i * 2.4); dy = Math.sin(i * 2.4); d = 1; }
          var k = (D - d) / 2 * 0.7, ux = dx / d, uy = dy / d;
          pts[i].px -= ux * k; pts[i].py -= uy * k; pts[j].px += ux * k; pts[j].py += uy * k; moved = true;
        }
      }
    }
    if(!moved) break;
  }
  var svg = document.createElementNS(SVGNS, "svg");
  svg.setAttribute("width", W); svg.setAttribute("height", H);
  svg.style.cssText = "position:absolute;left:0;top:0;pointer-events:none";
  pts.forEach(function(p){
    if(Math.hypot(p.px - p.ox, p.py - p.oy) > 3){
      var l = document.createElementNS(SVGNS, "line");
      l.setAttribute("x1", p.ox); l.setAttribute("y1", p.oy); l.setAttribute("x2", p.px); l.setAttribute("y2", p.py);
      l.setAttribute("stroke", "#004648"); l.setAttribute("stroke-width", "1.5"); svg.appendChild(l);
      var c = document.createElementNS(SVGNS, "circle");
      c.setAttribute("cx", p.ox); c.setAttribute("cy", p.oy); c.setAttribute("r", "2.5"); c.setAttribute("fill", "#004648"); svg.appendChild(c);
    }
  });
  pinsEl.appendChild(svg);
  lastPos = {};
  pts.forEach(function(p){ lastPos[p.sh.n] = { x: p.px, y: p.py }; addPin(p); });
  placePopup();
}
function addPin(p){
  var sh = p.sh, b = document.createElement("button"); b.type = "button"; b.className = "pin";
  b.style.left = p.px + "px"; b.style.top = p.py + "px"; b.textContent = sh.n;
  b.setAttribute("aria-label", sh.n + ". " + sh.name + ", " + sh.addr);
  if(sh === selected) b.className += " sel";
  b.addEventListener("click", function(e){ e.stopPropagation(); select(sh, false); });
  b.addEventListener("pointerdown", function(e){ e.stopPropagation(); });
  pinsEl.appendChild(b);
}

/* --- fenêtre d’information --- */
var popAnchor = null;
function placePopup(){
  if(!popAnchor){ popup.hidden = true; return; }
  var lp = selected && lastPos[selected.n], px = lp ? lp.x : popAnchor.x * s + tx, py = lp ? lp.y : popAnchor.y * s + ty;
  popup.hidden = false;
  var half = 120, left = Math.min(W - half - 6, Math.max(half + 6, px));
  popup.style.left = left + "px"; popup.style.top = py + "px";
  popup.style.setProperty("--arrow", (px - left) + "px");
}
function fillPopup(title, addr, members){
  popup.textContent = "";
  var x = document.createElement("button"); x.type = "button"; x.className = "x"; x.textContent = "×"; x.setAttribute("aria-label", T[lang].close);
  x.addEventListener("click", function(){ select(null); });
  popup.appendChild(x);
  if(members){
    var ul = document.createElement("ul");
    members.forEach(function(m){
      var li = document.createElement("li"), bt = document.createElement("button"); bt.type = "button";
      bt.textContent = m.sh.n + ". " + m.sh.name; bt.addEventListener("click", function(){ select(m.sh, true); });
      li.appendChild(bt); ul.appendChild(li);
    });
    popup.appendChild(ul);
  } else {
    var st = document.createElement("strong"); st.textContent = title; popup.appendChild(st);
    var p = document.createElement("span"); p.textContent = addr; popup.appendChild(p);
  }
}
function showGroup(grp, cx, cy){
  selected = null; markList();
  fillPopup("", "", grp);
  popAnchor = { x: (cx - tx) / s, y: (cy - ty) / s - 0 };
  render();
}
function select(sh, fly){
  selected = sh;
  if(!sh){ popAnchor = null; markList(); render(); return; }
  fillPopup(sh.n + ". " + sh.name, sh.addr);
  popAnchor = { x: sh.x, y: sh.y };
  markList();
  if(fly){ flyTo(sh.x, sh.y, Math.max(s, 0.65), function(){ render(); }); } else { render(); }
  var li = listEl.querySelector('button[data-n="' + sh.n + '"]');
  if(li && li.scrollIntoView){ var r = li.getBoundingClientRect(), pr = listEl.getBoundingClientRect(); if(r.top < pr.top || r.bottom > pr.bottom){ listEl.scrollTop += (r.top - pr.top) - pr.height / 2; } }
}

/* --- liste & recherche --- */
function buildList(){
  listEl.textContent = "";
  visible.forEach(function(sh){
    var li = document.createElement("li"), b = document.createElement("button"); b.type = "button"; b.setAttribute("data-n", sh.n);
    var n = document.createElement("span"); n.className = "num"; n.textContent = sh.n;
    var d = document.createElement("span"), t = document.createElement("span"), a = document.createElement("span");
    t.className = "t"; t.textContent = sh.name; a.className = "a"; a.textContent = sh.addr; d.appendChild(t); d.appendChild(a);
    b.appendChild(n); b.appendChild(d);
    b.addEventListener("click", function(){ select(sh, true); wrap.scrollIntoView && window.innerWidth <= 820 && wrap.scrollIntoView({ block: "nearest", behavior: "smooth" }); });
    li.appendChild(b); listEl.appendChild(li);
  });
  $("vef-none").hidden = visible.length > 0;
  $("vef-count").textContent = T[lang].count(visible.length, SHOPS.length);
  markList();
}
function markList(){
  var all = listEl.querySelectorAll("button");
  for(var i = 0; i < all.length; i++){ all[i].classList.toggle("sel", !!selected && +all[i].getAttribute("data-n") === selected.n); }
}
qEl.addEventListener("input", function(){
  var q = norm(qEl.value.trim());
  visible = q ? SHOPS.filter(function(x){ return x.key.indexOf(q) > -1; }) : SHOPS.slice();
  if(selected && visible.indexOf(selected) < 0){ selected = null; popAnchor = null; }
  buildList(); render();
  if(q && visible.length){
    var minx = 1e9, maxx = -1e9, miny = 1e9, maxy = -1e9;
    visible.forEach(function(v){ minx = Math.min(minx, v.x); maxx = Math.max(maxx, v.x); miny = Math.min(miny, v.y); maxy = Math.max(maxy, v.y); });
    var w = Math.max(150, maxx - minx), h = Math.max(150, maxy - miny);
    flyTo((minx + maxx) / 2, (miny + maxy) / 2, Math.min(0.9, Math.min((W - 120) / w, (H - 120) / h)));
  } else if(!q){ flyTo(IW / 2, IH / 2, fit); }
});

/* --- interactions souris / tactile / clavier --- */
var ptrs = {}, last = null, moved = false;
wrap.addEventListener("pointerdown", function(e){
  if(e.target.closest(".ctrl") || e.target.closest(".popup")) return;
  if(anim){ cancelAnimationFrame(anim); anim = null; }
  ptrs[e.pointerId] = { x: e.clientX, y: e.clientY }; moved = false;
  try{ wrap.setPointerCapture(e.pointerId); }catch(_){}
  wrap.classList.add("drag"); last = null;
});
wrap.addEventListener("pointermove", function(e){
  var p = ptrs[e.pointerId]; if(!p) return;
  var ids = Object.keys(ptrs);
  var r = wrap.getBoundingClientRect();
  if(ids.length === 1){
    var dx = e.clientX - p.x, dy = e.clientY - p.y;
    if(Math.abs(dx) + Math.abs(dy) > 2) moved = true;
    p.x = e.clientX; p.y = e.clientY; tx += dx; ty += dy; clamp(); render();
  } else if(ids.length === 2){
    var o = ids[0] == e.pointerId ? ptrs[ids[1]] : ptrs[ids[0]];
    var d0 = Math.hypot(p.x - o.x, p.y - o.y);
    p.x = e.clientX; p.y = e.clientY;
    var d1 = Math.hypot(p.x - o.x, p.y - o.y);
    if(d0 > 0){ zoomAt((p.x + o.x) / 2 - r.left, (p.y + o.y) / 2 - r.top, s * d1 / d0); moved = true; }
  }
});
function up(e){
  delete ptrs[e.pointerId];
  if(!Object.keys(ptrs).length){ wrap.classList.remove("drag"); }
}
wrap.addEventListener("pointerup", function(e){
  var wasTap = !moved && Object.keys(ptrs).length === 1 && !e.target.closest(".pin");
  up(e); if(wasTap && selected){ select(null); } else if(wasTap && popAnchor){ select(null); }
});
wrap.addEventListener("pointercancel", up);
wrap.addEventListener("wheel", function(e){
  if(!(e.ctrlKey || e.metaKey)) return;
  e.preventDefault();
  var r = wrap.getBoundingClientRect();
  zoomAt(e.clientX - r.left, e.clientY - r.top, s * Math.exp(-e.deltaY * 0.0025));
}, { passive: false });
wrap.addEventListener("keydown", function(e){
  var st = 60, k = e.key;
  if(k === "ArrowLeft") tx += st; else if(k === "ArrowRight") tx -= st; else if(k === "ArrowUp") ty += st; else if(k === "ArrowDown") ty -= st;
  else if(k === "+" || k === "=") { zoomAt(W / 2, H / 2, s * 1.4); e.preventDefault(); return; }
  else if(k === "-" || k === "_") { zoomAt(W / 2, H / 2, s / 1.4); e.preventDefault(); return; }
  else if(k === "Escape") { select(null); return; }
  else return;
  e.preventDefault(); clamp(); render();
});
$("vef-zin").addEventListener("click", function(){ zoomAt(W / 2, H / 2, s * 1.5); });
$("vef-zout").addEventListener("click", function(){ zoomAt(W / 2, H / 2, s / 1.5); });
$("vef-reset").addEventListener("click", function(){ select(null); qEl.value = ""; qEl.dispatchEvent(new Event("input")); flyTo(IW / 2, IH / 2, fit); });

/* --- langue --- */
function applyLang(l){
  lang = l; var t = T[l];
  document.querySelectorAll("#vef .lang button").forEach(function(b){ b.setAttribute("aria-pressed", String(b.getAttribute("data-l") === l)); });
  $("vef-title").textContent = t.title; $("vef-sub").textContent = t.sub; qEl.placeholder = t.search; qEl.setAttribute("aria-label", t.search);
  $("vef-none").textContent = t.none; $("vef-hint").textContent = (window.matchMedia && matchMedia("(pointer: coarse)").matches) ? t.hintTouch : t.hint; $("vef-note").textContent = t.note;
  wrap.setAttribute("aria-label", t.map);
  $("vef-count").textContent = t.count(visible.length, SHOPS.length);
  if(selected){ fillPopup(selected.n + ". " + selected.name, selected.addr); }
  render();
}
document.querySelectorAll("#vef .lang button").forEach(function(b){ b.addEventListener("click", function(){ applyLang(b.getAttribute("data-l")); }); });

/* --- init --- */
function resize(){
  var r = wrap.getBoundingClientRect(); W = r.width; H = r.height;
  fit = Math.min(W / IW, H / IH);
  if(!inited){ s = fit; tx = (W - IW * s) / 2; ty = (H - IH * s) / 2; inited = true; }
  if(s < fit) s = fit; clamp(); render();
}
window.addEventListener("resize", resize);
buildList(); applyLang(lang); resize();
})();
</script>
